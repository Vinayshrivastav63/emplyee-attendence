
services:

  web:
    build: .
    container_name: attendance-app
    ports:
      - "5001:5000"
    environment:
      DATABASE_URL: postgresql://attendance_user:attendance_pass@db:5432/attendance_db
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:17-alpine
    container_name: attendance-db
    environment:
      POSTGRES_USER: attendance_user
      POSTGRES_PASSWORD: attendance_pass
      POSTGRES_DB: attendance_db
    volumes:
      - attendance-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U attendance_user -d attendance_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  attendance-data:
